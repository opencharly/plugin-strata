# The Go gates for this plugin's own module (R7: tests that can fail).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: candy/plugin-strata/go.mod
          cache-dependency-path: candy/plugin-strata/go.sum

      - name: gofmt
        working-directory: candy/plugin-strata
        run: test -z "$(gofmt -l .)"

      - name: go vet
        working-directory: candy/plugin-strata
        run: GOWORK=off go vet ./...

      - name: build
        working-directory: candy/plugin-strata
        run: GOWORK=off go build ./...

      - name: tests (live qdrant test skips without a binary)
        working-directory: candy/plugin-strata
        run: GOWORK=off go test ./...
